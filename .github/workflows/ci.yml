name: CI

on:
  push:
    branches-ignore: [main, ci-logs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create the debug keystore
        # app/build.gradle.kts signs debug builds with ./debug.keystore, which is git-ignored
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |FAILED|AssertionError|Execution failed|Compilation error" -A1 build.log | grep -v "^--$" | head -25 | while IFS= read -r l; do echo "::error::${l:0:800}"; done

      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew lintDebug --console=plain

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
