name: CI

on:
  push:
    branches-ignore: [main, ci-logs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Gemini API key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          fi

      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log

      - name: Clean temporary secret file
        if: always()
        shell: bash
        run: rm -f .env

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |FAILED|AssertionError|Execution failed|Compilation error" -A1 build.log | grep -v "^--$" | head -25 | while IFS= read -r l; do echo "::error::${l:0:800}"; done

      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew lintDebug --console=plain

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
