name: CI

on:
  push:
    branches-ignore: [main, ci-logs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |FAILED|What went wrong|AssertionError|^> " build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:800}"; done

      - name: Lint (informational)
        continue-on-error: true
        run: ./gradlew lintDebug --console=plain

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
