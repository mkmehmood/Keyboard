name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SP="$KS_PASS"; KA="$KS_ALIAS"; KP="$KS_KEYPASS"
          else
            echo "No signing secrets set: generating a throwaway key (APK installs, but updates need the same key)."
            SP=android123; KA=everydaykeys; KP=android123
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KA" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$SP" -keypass "$KP" -dname "CN=Everyday Keys"
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$SP"
            echo "KEY_ALIAS=$KA"
            echo "KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Configure Gemini API key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          else
            echo "::warning::GEMINI_API_KEY secret is not set in GitHub Actions repository secrets; AI features will require a key."
          fi

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log

      - name: Clean temporary secret file
        if: always()
        shell: bash
        run: rm -f .env

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk EverydayKeys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EverydayKeys-apk
          path: EverydayKeys.apk

      # One release, always tagged "latest": the tag moves to this commit and the APK on the release is replaced,
      # so there is a single download link and no new release per build.
      - name: Move the latest tag
        shell: bash
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Everyday Keys (latest)
          body: |
            Latest build: version ${{ env.APP_VERSION }}, commit ${{ github.sha }}.
            This release is updated in place on every build. Install the APK over the existing app to update it.
          files: EverydayKeys.apk
          overwrite_files: true
          make_latest: true

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/l && tail -n 300 build.log > /tmp/l/build.log || echo "no log" > /tmp/l/build.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs && git rm -rf . -q
          cp /tmp/l/build.log build.log && git add -f build.log
          git commit -qm "build log" && git push -f origin ci-logs
