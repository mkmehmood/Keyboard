name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SP="$KS_PASS"; KA="$KS_ALIAS"; KP="$KS_KEYPASS"
          else
            echo "No signing secrets set: generating a throwaway key (APK installs, but updates need the same key)."
            SP=android123; KA=everydaykeys; KP=android123
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KA" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$SP" -keypass "$KP" -dname "CN=Everyday Keys"
          fi
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$SP"
            echo "KEY_ALIAS=$KA"
            echo "KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "EverydayKeys-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EverydayKeys-apk
          path: EverydayKeys-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Everyday Keys ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: EverydayKeys-v*.apk
          generate_release_notes: true

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/l && tail -n 300 build.log > /tmp/l/build.log || echo "no log" > /tmp/l/build.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs && git rm -rf . -q
          cp /tmp/l/build.log build.log && git add -f build.log
          git commit -qm "build log" && git push -f origin ci-logs
