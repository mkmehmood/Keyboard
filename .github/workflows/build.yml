name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Execution failed|Caused by|AAPT|Could not" -A2 build.log | cut -c1-300 > errors.txt
            for part in 1 2 3; do
              start=$(( (part-1)*3000 + 1 ))
              chunk=$(tail -c +$start errors.txt | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
              [ -n "$chunk" ] && echo "::error title=Build errors part $part::$chunk"
            done
          fi
          exit $code

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/EverydayKeys-1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Everyday Keys 1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.apk
